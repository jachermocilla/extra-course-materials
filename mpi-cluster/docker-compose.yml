#version: "3.9"

# ─────────────────────────────────────────────
#  OpenMPI Cluster
#  - 1 master node
#  - N worker nodes (default: 3)
#
#  Usage:
#    docker compose up --build -d
#    docker compose exec master bash
#    mpirun --hostfile ~/mpi_work/hostfile -np 8 ./examples/hello_world
# ─────────────────────────────────────────────

networks:
  mpi-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 192.137.125.0/24

volumes:
  mpi-shared:
    driver: local
  ssh-keys:
    driver: local

services:

  # ── Build the shared base image ──────────────
  mpi-base:
    image: mpi-base:latest
    build:
      context: .
      dockerfile: Dockerfile.base
    profiles:
      - build   # only used as a build target; never started directly

  # ── Master node ──────────────────────────────
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: mpi-master
    hostname: master
    networks:
      mpi-cluster:
        ipv4_address: 192.137.125.10
    ports:
      - "2222:22"       # SSH access from host
    volumes:
      - mpi-shared:/home/mpiuser/mpi_work/shared
      - ssh-keys:/home/mpiuser/.ssh
    environment:
      - MPI_WORKER_COUNT=3
      - MPI_WORKER_PREFIX=worker
    depends_on:
      - worker1
      - worker2
      - worker3
    stdin_open: true
    tty: true

  # ── Worker nodes ─────────────────────────────
  worker1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mpi-worker1
    hostname: worker1
    networks:
      mpi-cluster:
        ipv4_address: 192.137.125.11
    volumes:
      - mpi-shared:/home/mpiuser/mpi_work/shared
      - ssh-keys:/home/mpiuser/.ssh

  worker2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mpi-worker2
    hostname: worker2
    networks:
      mpi-cluster:
        ipv4_address: 192.137.125.12
    volumes:
      - mpi-shared:/home/mpiuser/mpi_work/shared
      - ssh-keys:/home/mpiuser/.ssh

  worker3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mpi-worker3
    hostname: worker3
    networks:
      mpi-cluster:
        ipv4_address: 192.137.125.13
    volumes:
      - mpi-shared:/home/mpiuser/mpi_work/shared
      - ssh-keys:/home/mpiuser/.ssh
